<figure class="cid">
<svg viewBox="0 0 560 260" width="560" role="img" aria-labelledby="cid-t cid-d" xmlns="http://www.w3.org/2000/svg">
<title id="cid-t">Causal influence diagram of the oil wildcatter problem</title>
<desc id="cid-d">Decision nodes T (test) and D (drill) are rectangles, chance nodes R (test result) and O (oil) are circles, and the utility nodes C (test cost) and U (payoff) are diamonds. Arrows run from T to R, T to C, O to R, T to D, R to D, D to U and O to U. The arrows into D are dashed information links.</desc>
<style>
.cid { color: var(--ink); }
.cid svg { max-width: 100%; height: auto; overflow: visible; }
.cid .node { fill: var(--paper); stroke: currentColor; stroke-width: 2; }
.cid .dec  { fill: var(--hover); }
.cid .util { fill: var(--hover); stroke: var(--accent); }
.cid .edge { fill: none; stroke: currentColor; stroke-width: 1.6; }
.cid .info { stroke-dasharray: 5 4; }
.cid .head { fill: currentColor; }
.cid .lab  { fill: currentColor; font-family: var(--serif); font-style: italic; font-size: 24px; }
.cid .name { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
</style>
<defs>
<marker id="cid-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path class="head" d="M 0 0 L 10 5 L 0 10 Z"/>
</marker>
</defs>

<!-- edges -->
<path class="edge" d="M 126 70 H 252" marker-end="url(#cid-arrow)"/>
<path class="edge" d="M 442 70 H 308" marker-end="url(#cid-arrow)"/>
<path class="edge info" d="M 125 94 L 245 176" marker-end="url(#cid-arrow)"/>
<path class="edge info" d="M 280 98 V 176" marker-end="url(#cid-arrow)"/>
<path class="edge" d="M 316 200 H 436" marker-end="url(#cid-arrow)"/>
<path class="edge" d="M 470 98 V 166" marker-end="url(#cid-arrow)"/>
<path class="edge" d="M 90 94 V 166" marker-end="url(#cid-arrow)"/>

<!-- decision nodes -->
<rect class="node dec" x="54" y="46" width="72" height="48" rx="2"/>
<text class="lab" x="90" y="78" text-anchor="middle">T</text>
<text class="name" x="90" y="34" text-anchor="middle">test</text>

<rect class="node dec" x="244" y="176" width="72" height="48" rx="2"/>
<text class="lab" x="280" y="208" text-anchor="middle">D</text>
<text class="name" x="280" y="246" text-anchor="middle">drill</text>

<!-- chance nodes -->
<circle class="node" cx="280" cy="70" r="28"/>
<text class="lab" x="280" y="78" text-anchor="middle">R</text>
<text class="name" x="280" y="30" text-anchor="middle">result</text>

<circle class="node" cx="470" cy="70" r="28"/>
<text class="lab" x="470" y="78" text-anchor="middle">O</text>
<text class="name" x="470" y="30" text-anchor="middle">oil</text>

<!-- utility nodes -->
<path class="node util" d="M 90 166 L 124 200 L 90 234 L 56 200 Z"/>
<text class="lab" x="90" y="208" text-anchor="middle">C</text>
<text class="name" x="90" y="254" text-anchor="middle">cost</text>

<path class="node util" d="M 470 166 L 504 200 L 470 234 L 436 200 Z"/>
<text class="lab" x="470" y="208" text-anchor="middle">U</text>
<text class="name" x="470" y="254" text-anchor="middle">payoff</text>
</svg>
<figcaption>Figure 2. Causal influence diagram of the oil wildcatter problem. Rectangles are decisions, circles are chance nodes, diamonds are utilities. Dashed arrows are information links.</figcaption>
</figure>
