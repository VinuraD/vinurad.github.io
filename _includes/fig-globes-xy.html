<style>

.gxy .lab  { fill: currentColor; font-family: var(--serif); font-style: italic; font-size: 30px; }
.gxy .lit  { fill: var(--gxy-glow); }
.gxy .fil  { fill: none; stroke: var(--gxy-glow); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.gxy .a { animation: gxy-a 4.3s ease-in-out infinite; }
.gxy .b { animation: gxy-b 6.1s ease-in-out infinite -2.2s; }

}
@media (prefers-reduced-motion: reduce) {
  .gxy .a, .gxy .b { animation: none; opacity: .6; }
}
</style>
